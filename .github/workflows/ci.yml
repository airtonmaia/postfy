name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Testes
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verificar artefatos do build
        run: |
          test -f dist/index.html || { echo "dist/index.html não gerado"; exit 1; }
          test -d dist/assets || { echo "dist/assets não gerado"; exit 1; }

      # A chave de serviço do Supabase ignora a RLS. Se ela vazar para o
      # bundle, todo o isolamento entre agências cai por terra.
      #
      # Procuramos o FORMATO de uma chave real, não o nome da variável:
      # bibliotecas legitimamente contêm strings como "sb_secret_" no código
      # que detecta o tipo da chave, e casar com o nome dava falso positivo.
      - name: Garantir que nenhum segredo foi para o bundle
        run: |
          falhou=0

          # Chave secreta do Supabase: prefixo seguido de material real.
          if grep -rqE 'sb_secret_[A-Za-z0-9_-]{20,}' dist/assets/ 2>/dev/null; then
            echo "ERRO: chave secreta do Supabase encontrada no bundle."
            falhou=1
          fi

          # JWT com papel de serviço (a anon/publishable é esperada e permitida).
          for jwt in $(grep -rohE 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' dist/assets/ 2>/dev/null | sort -u); do
            corpo=$(echo "$jwt" | cut -d. -f2)
            # base64url -> base64, com padding
            corpo=$(echo "$corpo" | tr '_-' '/+')
            while [ $(( ${#corpo} % 4 )) -ne 0 ]; do corpo="${corpo}="; done
            if echo "$corpo" | base64 -d 2>/dev/null | grep -q 'service_role'; then
              echo "ERRO: JWT com role de serviço encontrado no bundle."
              falhou=1
            fi
          done

          # Chaves de terceiros que só podem existir no servidor.
          if grep -rqE 're_[A-Za-z0-9]{20,}' dist/assets/ 2>/dev/null; then
            echo "ERRO: chave do Resend encontrada no bundle."
            falhou=1
          fi
          if grep -rqE 'AIza[A-Za-z0-9_-]{30,}' dist/assets/ 2>/dev/null; then
            echo "ERRO: chave de API do Google encontrada no bundle."
            falhou=1
          fi

          [ "$falhou" -eq 0 ] || exit 1
          echo "Nenhum segredo de servidor no bundle."
