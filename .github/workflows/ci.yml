name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Testes
        run: bun run test

      - name: Build
        run: bun run build

      - name: Servidor de produção sobe e responde
        run: |
          NODE_ENV=production PORT=3000 DATA_DIR=/tmp/ci-data node dist/server.mjs &
          SERVIDOR=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/health || { echo "servidor não respondeu"; exit 1; }
          # As rotas de dados não podem responder sem sessão.
          CODIGO=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/data)
          if [ "$CODIGO" != "401" ]; then
            echo "esperava 401 em /api/data sem sessão, recebi $CODIGO"
            exit 1
          fi
          kill $SERVIDOR
