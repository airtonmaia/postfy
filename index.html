<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orquesia — Sistema Operacional para Agências</title>
    <meta name="description" content="Sistema operacional completo para agências: pautas, Kanban, calendário editorial, aprovações, publicações e relatórios." />
    <meta property="og:title" content="Orquesia — Sistema Operacional para Agências" />
    <meta property="og:description" content="Sistema operacional completo para agências: pautas, Kanban, calendário editorial, aprovações, publicações e relatórios." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      PWA. O manifest é por **origem**, não por agência: o app instalado se
      chama Orquesia para todo mundo. O portal do cliente, que é whitelabel,
      fica de fora desta entrega por isso — o ícone na tela de início dele
      teria a marca errada, e a única saída honesta é domínio próprio.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7c3aed" />
    <!--
      O iOS ignora os ícones do manifest e usa este. E aqui ele não é
      enfeite: no iPhone o Web Push **só existe** com o app adicionado à tela
      de início, então este link é parte do caminho da notificação, não da
      aparência.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
